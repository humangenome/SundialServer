name: Release

# Tag-triggered. This is the ONLY way a SundialServer bundle gets published.
#
# It exists because v0.1.68 was hand-built on a workstation and hand-uploaded.
# That bundle shipped a developer's home directory in twelve binaries and two
# internal identifiers in readable Lua, to a public release page and -- because
# the same file is mirrored to the CDN hosts install from -- to every host
# running the product. Nothing caught it, because there was nothing to catch it
# with.
#
# So the gates below all run BEFORE the release is created, and then again on
# the bytes downloaded back from the published release:
#
#   source deny list      internal references never reach the public repo
#   version stamp         the artifact reports the tag it publishes under
#   pinned runtime        the UE4SS binaries are the reviewed ones, by hash
#   bundle layout         a complete host bundle, not a bare publish output
#   privacy               nothing private in any member, in both encodings
#   never-publish policy  the repo's standing artifact policy
#   asset set             nothing was attached by hand alongside it
#
# Never attach an asset to a SundialServer release by hand. The read-back job
# fails if anything shows up that this workflow did not build.
#
# The release page is made BY HAND, as a draft, before the tag is pushed (Security
# 2026-11-25): title, and exactly the notes in .github/release-notes/<tag>.md. A
# tag push then only fills that draft with the two files this run built. It never
# creates, publishes or mirrors a release, and never marks one Latest: it refuses
# when there is no draft for the tag, when there is more than one release for it,
# when that release is already published, or when the draft's text differs from
# the notes file. After the run: read the assets back by sha256, scan the draft
# (oss-artifact-scan reads drafts with the maintainer's login), then publish by hand.
#
# workflow_dispatch runs everything except the draft, against the version in
# Directory.Build.props. Rehearse there rather than burning a tag. With fill_draft
# on, the rehearsal also fills a throwaway draft for that version (delete it after).

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      fill_draft:
        description: 'Also fill the hand-made draft release for the Directory.Build.props version (never published)'
        type: boolean
        default: false

# Read-only by default. The package job fills this repo's draft release and the verify job reads it
# back; both need contents: write, because GitHub shows draft releases only to callers that can write.
permissions:
  contents: read

env:
  # The UE4SS runtime is pinned as a file in vendor/ue4ss/, not as a URL.
  # Upstream re-cuts its moving tag in place and serves different bytes under
  # the same asset name, so a download-at-release-time pipeline ships whatever
  # happens to be there that day. See vendor/ue4ss/README.md.
  UE4SS_SHA256: 2ad348bf2025bd26b2aa63b478d9813afbd4e656c9bcfb3fdf6752c4d285f298
  UE4SS_PROXY_SHA256: 8afd615b5c33c34bb2822af01dfe862097a8a82e1a1bd7888268e6467f4e1627
  # MinHook, pinned by commit. The build scripts clone the default branch when
  # the source is absent, which makes the native plugin a different binary on
  # every release for reasons nobody recorded.
  MINHOOK_COMMIT: d94c64d32ea37bc4f5ee47d580709f70c6fb6080

jobs:
  # Cheap Linux preconditions. Everything they catch is permanent once a release
  # publishes, so they run before a single binary is built.
  guard:
    name: Guard release preconditions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # First step, before anything else runs, on a tag push: refuse any tag that is
      # not a release version (every tag this repo has published is v and three
      # numbers). The tag reaches the shell only through TAG, always quoted.
      - name: Check tag
        if: github.event_name == 'push'
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          pattern='^v[0-9]+\.[0-9]+\.[0-9]+$'
          if [[ ! "${TAG}" =~ ${pattern} ]]; then
            echo "::error::refusing this tag: a release tag here is v and three numbers, like v1.2.3"
            exit 1
          fi
          echo "tag ${TAG} is a release version"

      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Resolve the release tag
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="v$(sed -n 's/.*<Version>\(.*\)<\/Version>.*/\1/p' Directory.Build.props | head -1)"
          fi
          # The same refusal as the first step, for the rehearsal's version too.
          pattern='^v[0-9]+\.[0-9]+\.[0-9]+$'
          if [[ ! "${tag}" =~ ${pattern} ]]; then
            echo "::error::refusing this tag: a release tag here is v and three numbers, like v1.2.3"
            exit 1
          fi
          echo "TAG=${tag}" >> "$GITHUB_ENV"

      - name: Guard the published source
        shell: bash
        env:
          SUNDIAL_DENY_PATTERN: ${{ github.event_name == 'push' && secrets.SUNDIAL_DENY_PATTERN || '' }}
        run: |
          # This repo is public. A short deny list guards the terms that must
          # never appear in it -- internal hosting references, an operator's
          # machine, support/host identifiers, and headless-auth residue from
          # sibling projects. The list lives in the repository secret
          # SUNDIAL_DENY_PATTERN (one extended regular expression), not in this
          # file: an encoded copy here published the strings it protects. It is
          # passed on tag pushes only, and a tag push without it is refused. A
          # manual run publishes nothing, gets no secret and skips this check.
          # A hit prints the file and line only, because CI logs are public.
          #
          # The published-artifact scanner and its workflow carry rule tables as
          # data, so both are excluded.
          BANNED="$(printf '%s' "${SUNDIAL_DENY_PATTERN:-}" | tr -d '\r\n')"
          if [ -z "$BANNED" ]; then
            if [ "${{ github.event_name }}" = "push" ]; then
              echo "::error::the deny list secret SUNDIAL_DENY_PATTERN is not set; refusing to release unchecked source"
              exit 1
            fi
            echo "manual run: the deny list is not passed here (this run publishes nothing); skipped"
            exit 0
          fi
          hits="$(grep -rnIE -e "$BANNED" \
               --exclude-dir=.git --exclude-dir=bin --exclude-dir=obj --exclude-dir=dist \
               --exclude=verify-published-artifacts.py \
               --exclude=artifact-scan.yml . | cut -d: -f1,2 || true)"
          if [ -n "$hits" ]; then
            echo "::error::deny-listed term found in the published source (file and line; the term is not shown):"
            printf '%s\n' "$hits"
            exit 1
          fi
          echo "clean"

      - name: Check the tag matches the version stamp
        shell: bash
        run: |
          set -euo pipefail
          source_version="$(sed -n 's/.*<Version>\(.*\)<\/Version>.*/\1/p' Directory.Build.props | head -1)"
          tag_version="${TAG#v}"
          echo "source=$source_version tag=$tag_version"
          if [ "$source_version" != "$tag_version" ]; then
            echo "::error::Directory.Build.props is $source_version but the tag is $TAG. Bump the version in the same commit as the tag."
            exit 1
          fi

      - name: Check the pinned UE4SS runtime is the reviewed one
        shell: bash
        run: |
          set -euo pipefail
          for pair in "vendor/ue4ss/UE4SS.dll ${UE4SS_SHA256}" "vendor/ue4ss/dwmapi.dll ${UE4SS_PROXY_SHA256}"; do
            # shellcheck disable=SC2086 # pair is "file hash", split on purpose
            set -- $pair
            if [ ! -f "$1" ]; then
              echo "::error::pinned runtime missing: $1"
              exit 1
            fi
            got="$(sha256sum "$1" | awk '{print $1}')"
            if [ "$got" != "$2" ]; then
              echo "::error::$1 is $got, pinned $2. A UE4SS core swap changes signature scanning and mod loading; validate a real host start and move the pin deliberately."
              exit 1
            fi
            echo "ok $1 $got"
          done

      - name: Build the release body
        shell: bash
        run: |
          set -euo pipefail
          notes=".github/release-notes/${TAG}.md"
          if [ ! -f "$notes" ]; then
            echo "::error::missing release notes: $notes. A tag without notes publishes an empty release body, and a release body is not something you get to write later."
            exit 1
          fi
          if [ -z "$(tr -d '[:space:]' < "$notes")" ]; then
            echo "::error::$notes is empty"
            exit 1
          fi
          cp "$notes" release-body.md
          cat release-body.md

      - name: Upload the release body
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: release-body
          path: release-body.md
          retention-days: 7

  # build.bat is the documented MSVC path for a Windows workstation. It does not
  # produce the shipped binary (see native/SolarpunkPlugin/build.sh for why), so
  # its output is discarded -- this job exists only to stop that path rotting.
  msvc-check:
    name: Check the MSVC build path still compiles
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Fetch MinHook at the pinned commit
        shell: pwsh
        run: |
          $dest = "native/SolarpunkPlugin/minhook"
          git init $dest
          if ($LASTEXITCODE -ne 0) { throw "git init failed" }
          git -C $dest remote add origin https://github.com/TsudaKageyu/minhook.git
          git -C $dest fetch --depth 1 origin $env:MINHOOK_COMMIT
          if ($LASTEXITCODE -ne 0) { throw "could not fetch MinHook at $env:MINHOOK_COMMIT" }
          git -C $dest checkout FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { throw "could not check out MinHook at $env:MINHOOK_COMMIT" }
          $head = (git -C $dest rev-parse HEAD).Trim()
          if ($head -ne $env:MINHOOK_COMMIT) { throw "MinHook is at $head, pinned $env:MINHOOK_COMMIT" }
          Write-Host "MinHook pinned at $head"

      - name: Build with build.bat
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw "vswhere is not on this runner" }
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw "no MSVC x64 toolchain on this runner" }
          $vcvars = Join-Path $vs "VC\Auxiliary\Build\vcvars64.bat"
          if (-not (Test-Path $vcvars)) { throw "vcvars64.bat not found at $vcvars" }
          cmd /c "`"$vcvars`" >nul && native\SolarpunkPlugin\build.bat"
          if ($LASTEXITCODE -ne 0) { throw "the MSVC build path is broken" }
          $dll = "native/SolarpunkPlugin/build/SolarpunkPlugin.dll"
          if (-not (Test-Path $dll)) { throw "build.bat produced nothing" }
          Write-Host "build.bat OK: $((Get-Item $dll).Length) bytes (not shipped)"

  # Packaging runs on Linux and through scripts/package-server.sh -- the same
  # script a maintainer runs locally. A release built by a private copy of the
  # packaging steps drifts from the one anyone can reproduce, and the drift is
  # invisible until it ships.
  package:
    name: Package and publish
    needs: [guard, msvc-check]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 30
    steps:
      # First step, before anything else runs, on a tag push: refuse any tag that is
      # not a release version (every tag this repo has published is v and three
      # numbers). The tag reaches the shell only through TAG, always quoted.
      - name: Check tag
        if: github.event_name == 'push'
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          pattern='^v[0-9]+\.[0-9]+\.[0-9]+$'
          if [[ ! "${TAG}" =~ ${pattern} ]]; then
            echo "::error::refusing this tag: a release tag here is v and three numbers, like v1.2.3"
            exit 1
          fi
          echo "tag ${TAG} is a release version"

      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Resolve the release tag
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="v$(sed -n 's/.*<Version>\(.*\)<\/Version>.*/\1/p' Directory.Build.props | head -1)"
          fi
          # The same refusal as the first step, for the rehearsal's version too.
          pattern='^v[0-9]+\.[0-9]+\.[0-9]+$'
          if [[ ! "${tag}" =~ ${pattern} ]]; then
            echo "::error::refusing this tag: a release tag here is v and three numbers, like v1.2.3"
            exit 1
          fi
          echo "TAG=${tag}" >> "$GITHUB_ENV"

      - name: Setup .NET 10
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build Solarpunk.Server.sln -c Release --nologo -warnaserror

      - name: Test
        run: dotnet test Solarpunk.Server.sln -c Release --no-build --nologo

      # The host mods' own regressions, including the object-search budget: a
      # release that searches the whole object list every tick again slows every
      # hosted world's clock (fixed 30 fps step), so it must not publish.
      - name: Lua regression tests
        run: |
          sudo apt-get update && sudo apt-get install -y lua5.4
          lua5.4 tests/world-upload-choice.lua
          lua5.4 tests/auth-eos-password.lua
          lua5.4 tests/host-scan-budget.lua
          lua5.4 tests/save-before-stop.lua
          lua5.4 tests/kick-ban-account.lua

      # The shipped plugin is a mingw-w64 build. That is not a preference: the
      # published v0.1.68 binary every host runs today is one, and this recipe
      # reproduces it at exactly its byte count. An MSVC build of the same
      # source is a 200 KB binary with no export table -- almost certainly fine,
      # and not something to find out about on a live fleet.
      - name: Install the cross toolchain
        timeout-minutes: 20
        run: |
          # On 2026-10-26 the runners fetched small packages from the Azure Ubuntu mirror but stalled
          # on the 11-15 MB ones for minutes. Use IPv4, bounded retries and per-request timeouts, and
          # fall back from the main archive to the Azure mirror before giving up.
          # The image now picks its mirror from /etc/apt/apt-mirrors.txt (a "mirror+file:" source), so
          # that file needs the same rewrite, or the fallback changes nothing.
          APT_OPTS="-o Acquire::ForceIPv4=true -o Acquire::Retries=3 -o Acquire::http::Timeout=20"
          ok=0
          for mirror in http://archive.ubuntu.com/ubuntu http://azure.archive.ubuntu.com/ubuntu; do
            for f in /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list; do
              if [ -f "$f" ]; then sudo sed -i -E "s#http://(azure\.)?archive\.ubuntu\.com/ubuntu#$mirror#g" "$f"; fi
            done
            # shellcheck disable=SC2086 # APT_OPTS is a word list, split on purpose
            if sudo -E timeout 180 apt-get $APT_OPTS update -q && sudo -E timeout 420 apt-get $APT_OPTS install -y -q --no-install-recommends g++-mingw-w64-x86-64; then ok=1; break; fi
            echo "apt install from $mirror failed; trying the next mirror"
          done
          [ "$ok" = 1 ] || { echo "toolchain install failed on every mirror"; exit 1; }

      - name: Build SolarpunkPlugin.dll
        run: bash native/SolarpunkPlugin/build.sh

      - name: Check the plugin is a real build of this source
        shell: bash
        run: |
          set -euo pipefail
          dll=native/SolarpunkPlugin/build/SolarpunkPlugin.dll
          [ -f "$dll" ] || { echo "::error::SolarpunkPlugin.dll was not produced"; exit 1; }
          size=$(stat -c%s "$dll")
          echo "$size bytes  sha256=$(sha256sum "$dll" | awk '{print $1}')"
          # A stub clears the bundle guard's 50 KB floor on size alone. Assert the
          # source's own diagnostics are in the binary instead.
          for marker in 'GetPreferredUniqueNetId hook failed' 'SolarpunkPlugin scan failed' 'sp-plugin.log'; do
            if ! grep -qF "$marker" "$dll"; then
              echo "::error::the built plugin does not contain \"$marker\" - it is not a build of this source"
              exit 1
            fi
          done
          echo "plugin carries its source diagnostics"

      - name: Build SolarpunkEosIdentity.dll
        shell: bash
        run: |
          set -euo pipefail
          bash native/SolarpunkEosIdentity/build.sh
          dll=native/SolarpunkEosIdentity/SolarpunkEosIdentity.dll
          for marker in 'SP_EOS_IDENTITY_FILE' 'ss_eos_identity.cred' 'EOSSDK-Win64-Shipping.dll'; do
            if ! LC_ALL=C grep -aqF "$marker" "$dll"; then
              echo "::error::SolarpunkEosIdentity.dll does not contain \"$marker\" - it is not a build of this source"
              exit 1
            fi
          done

      - name: Package the bundle
        run: bash scripts/package-server.sh "${TAG}"

      - name: Check the bundle reports the tag
        run: python3 scripts/check-bundle-version.py "dist/SundialServer-${TAG}.zip" "${TAG}"

      - name: Check the bundle layout
        run: python3 scripts/verify-server-bundle.py "dist/SundialServer-${TAG}.zip"

      # .NET 10 refuses to start a CET-compatible exe on a machine whose CPU has CET but whose Windows build does
      # not fully support it (2026-11-03, v0.1.97 on a Windows Server 2022 20348 host). The project sets
      # CETCompat=false; this proves the shipped exe really carries the flag off.
      - name: Check the server exe is not marked CET-compatible
        run: python3 scripts/check-cet-compat.py "dist/SundialServer-${TAG}.zip"

      # The privacy rules come from a repository secret on tag pushes only; a tag push without them is refused.
      # A manual run publishes nothing, gets no rules and runs the archive checks alone.
      - name: Check the bundle carries nothing private
        env:
          SUNDIAL_PRIVACY_RULES: ${{ github.event_name == 'push' && secrets.SUNDIAL_PRIVACY_RULES || '' }}
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            python3 scripts/verify-bundle-privacy.py --require-rules "dist/SundialServer-${TAG}.zip"
          else
            python3 scripts/verify-bundle-privacy.py "dist/SundialServer-${TAG}.zip"
          fi

      - name: Check the bundle against the never-publish policy
        run: python3 scripts/verify-published-artifacts.py "dist/SundialServer-${TAG}.zip"

      - name: Build checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum "SundialServer-${TAG}.zip" > checksums.txt
          cat checksums.txt

      - name: Download the release body
        if: github.event_name == 'push' || inputs.fill_draft
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: release-body

      # Fill the draft made by hand. GitHub's look-up of a release by tag answers 404 for a draft,
      # so a release action that looks one up that way makes a second release and publishes it.
      # gh finds drafts. Nothing here publishes, edits the text, or touches Latest.
      - name: Fill the hand-made draft release
        if: github.event_name == 'push' || inputs.fill_draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          rels="$(gh api "repos/${REPO}/releases?per_page=100" --paginate \
            | jq -s --arg t "${TAG}" 'add // [] | map(select(.tag_name == $t))')"
          n="$(jq 'length' <<<"${rels}")"
          if [ "${n}" -ne 1 ]; then
            echo "::error::expected exactly one release for ${TAG} (a draft made by hand first), found ${n}; nothing was uploaded"
            exit 1
          fi
          if [ "$(jq -r '.[0].draft' <<<"${rels}")" != "true" ]; then
            echo "::error::the release for ${TAG} is already published; this workflow only fills a hand-made draft and never changes a published release"
            exit 1
          fi
          jq -r '.[0].body // ""' <<<"${rels}" > draft-body.md
          python3 -I - draft-body.md release-body.md <<'PY'
          import sys
          a, b = (open(f, encoding="utf-8").read().replace("\r\n", "\n").rstrip() for f in sys.argv[1:3])
          if a != b:
              print("::error::the draft's text differs from the notes file; fix the draft by hand, nothing was uploaded")
              sys.exit(1)
          PY
          others="$(jq -r --arg z "SundialServer-${TAG}.zip" \
            '.[0].assets[].name | select(. != $z and . != "checksums.txt")' <<<"${rels}")"
          if [ -n "${others}" ]; then
            echo "::error::the draft already holds files this workflow does not build: ${others}"
            exit 1
          fi
          id="$(jq -r '.[0].id' <<<"${rels}")"
          gh release upload "${TAG}" -R "${REPO}" --clobber "dist/SundialServer-${TAG}.zip" dist/checksums.txt
          after="$(gh api "repos/${REPO}/releases/${id}")"
          if [ "$(jq -r '.draft' <<<"${after}")" != "true" ]; then
            echo "::error::release ${id} is no longer a draft after the upload"
            exit 1
          fi
          jq -r '.assets[] | "\(.name) \(.size)"' <<<"${after}"
          echo "Draft ${TAG} (release ${id}) holds this run's two files. Read them back, scan the draft, then publish by hand."

      - name: Rehearsal summary
        if: github.event_name != 'push'
        shell: bash
        env:
          FILL_DRAFT: ${{ inputs.fill_draft }}
        run: |
          echo "Rehearsal for ${TAG}: every gate passed and nothing was published."
          if [ "${FILL_DRAFT}" = "true" ]; then echo "The draft for ${TAG} was filled: delete it after the check."; fi
          ls -l dist

  # The build log is not the acceptance test. Download what the release actually
  # serves and put it through the same gates. A published artifact that differs
  # from the one that was gated is the failure this whole workflow exists to
  # prevent.
  verify:
    name: Verify the draft's files
    needs: package
    if: github.event_name == 'push' || inputs.fill_draft
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Write only because GitHub shows a draft release to writers alone; every step here only reads.
    permissions:
      contents: write
    steps:
      # First step of this job too, so it never relies on the other jobs' check.
      - name: Check tag
        if: github.event_name == 'push'
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          pattern='^v[0-9]+\.[0-9]+\.[0-9]+$'
          if [[ ! "${TAG}" =~ ${pattern} ]]; then
            echo "::error::refusing this tag: a release tag here is v and three numbers, like v1.2.3"
            exit 1
          fi
          echo "tag ${TAG} is a release version"

      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # As in the package job: the tag reaches the shell only through TAG.
      - name: Resolve the release tag
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="v$(sed -n 's/.*<Version>\(.*\)<\/Version>.*/\1/p' Directory.Build.props | head -1)"
          fi
          pattern='^v[0-9]+\.[0-9]+\.[0-9]+$'
          if [[ ! "${tag}" =~ ${pattern} ]]; then
            echo "::error::refusing this tag: a release tag here is v and three numbers, like v1.2.3"
            exit 1
          fi
          echo "TAG=${tag}" >> "$GITHUB_ENV"

      - name: The release is still an unpublished draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          rels="$(gh api "repos/${REPO}/releases?per_page=100" --paginate \
            | jq -s --arg t "${TAG}" 'add // [] | map(select(.tag_name == $t))')"
          if [ "$(jq 'length' <<<"${rels}")" -ne 1 ] || [ "$(jq -r '.[0].draft' <<<"${rels}")" != "true" ]; then
            echo "::error::${TAG} must be exactly one release, still a draft"
            exit 1
          fi
          echo "${TAG} is one draft release"

      - name: Download the draft's files
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "${TAG}" -R "${{ github.repository }}" -D published --clobber
          ls -l published

      - name: The release carries only what this workflow built
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          expected="$(printf 'SundialServer-%s.zip\nchecksums.txt\n' "${TAG}" | sort)"
          actual="$(gh release view "${TAG}" -R "${{ github.repository }}" --json assets --jq '.assets[].name' | sort)"
          echo "$actual"
          if [ "$expected" != "$actual" ]; then
            echo "::error::the release has assets this workflow did not build. Never attach a SundialServer asset by hand - hand-uploading is how v0.1.68 shipped a developer's home directory."
            diff <(echo "$expected") <(echo "$actual") || true
            exit 1
          fi

      - name: The published bytes match the published checksum
        shell: bash
        run: |
          set -euo pipefail
          cd published
          sha256sum -c checksums.txt

      - name: Gate the downloaded artifact
        shell: bash
        env:
          SUNDIAL_PRIVACY_RULES: ${{ secrets.SUNDIAL_PRIVACY_RULES }}
        run: |
          set -euo pipefail
          zip="published/SundialServer-${TAG}.zip"
          python3 scripts/check-bundle-version.py "$zip" "${TAG}"
          python3 scripts/verify-server-bundle.py "$zip"
          python3 scripts/check-cet-compat.py "$zip"
          python3 scripts/verify-bundle-privacy.py --require-rules "$zip"
          python3 scripts/verify-published-artifacts.py "$zip"

  # No scan job here: this run leaves a draft, which a read-only scan cannot see. Scan the
  # draft by hand before publishing it (oss-artifact-scan scan.py --repo SundialServer
  # --tag <tag> --full); artifact-scan.yml's daily run covers it once published.
