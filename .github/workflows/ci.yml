name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        run: dotnet build Solarpunk.Server.sln -c Release --nologo -warnaserror

      - name: Test
        run: dotnet test Solarpunk.Server.sln -c Release --no-build --nologo

      # The released binary reports its version from Directory.Build.props, so a
      # tag that disagrees with the source ships a server that lies about what
      # it is. Fail the tag instead.
      - name: Source version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          source_version="$(sed -n 's/.*<Version>\(.*\)<\/Version>.*/\1/p' Directory.Build.props | head -1)"
          tag_version="${GITHUB_REF_NAME#v}"
          echo "source=$source_version tag=$tag_version"
          if [ "$source_version" != "$tag_version" ]; then
            echo "::error::Directory.Build.props is $source_version but the tag is $GITHUB_REF_NAME. Bump the version in the same commit as the tag."
            exit 1
          fi

  lua:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.4

      - name: Parse-check the server mods
        run: |
          status=0
          for f in server-mods/*/Scripts/main.lua runtime/UE4SS_Signatures/*.lua; do
            if luac5.4 -p "$f"; then
              echo "ok   $f"
            else
              echo "FAIL $f"
              status=1
            fi
          done
          exit $status

      - name: The orchestrator is the only enabled mod
        run: |
          enabled="$(grep -oE '^[A-Za-z0-9_]+[[:space:]]*:[[:space:]]*1' runtime/Mods/mods.txt | grep -oE '^[A-Za-z0-9_]+' | grep '^Solarpunk' || true)"
          echo "enabled Solarpunk mods: $enabled"
          if [ "$enabled" != "SolarpunkServerRuntime" ]; then
            echo "::error::runtime/Mods/mods.txt must enable SolarpunkServerRuntime and nothing else from the Solarpunk stack."
            exit 1
          fi
