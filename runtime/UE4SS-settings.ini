[Overrides]
; ModsFolderPath is patched at runtime by the launcher (Ue4ssBootstrapService
; ConfigurePerInstanceModsPath) only when mods live outside the game tree; the
; default install drops Mods/ next to this file, which UE4SS scans natively.

[General]
EnableHotReloadSystem = 0
UseCache = 1
InvalidateCacheIfDLLDiffers = 1
; Solarpunk is UE 5.7 — give the AOB scanner generous time before falling back
; to the bundled UE4SS_Signatures/ patterns (derived from the shipped PDB,
; build SolarpunkSteam-Win64-Shipping).
SecondsToScanBeforeGivingUp = 180
bUseUObjectArrayCache = false

[EngineVersionOverride]
; UE4SS's experimental 5.7 support needs the explicit version (the build's
; version branding is non-standard).
MajorVersion = 5
MinorVersion = 7

[Debug]
ConsoleEnabled = 0
GuiConsoleEnabled = 0
GuiConsoleVisible = 0

[Crash]
EnableDumping = 0
